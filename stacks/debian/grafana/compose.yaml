version: "3.8"
services:
  grafana:
    image: grafana/grafana-oss
    container_name: grafana
    environment:
      - PUID=0
      - PGID=0
      - TZ=Asia/Shanghai
    volumes:
      - /mnt/nas/Config/grafana:/var/lib/grafana
    ports:
      - 3000:3000
    networks:
      - apps
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
networks:
  apps:
    external: true
