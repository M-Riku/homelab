version: "3.8"
services:
  dozzle:
    image: amir20/dozzle
    container_name: dozzle
    environment:
      - TZ=Asia/Shanghai
      - DOZZLE_REMOTE_HOST=tcp://appserver:2375|appserver,tcp://debian:2375|debian,tcp://bastion:2375|bastion,tcp://synologynas:2375|synologynas
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 9999:8080
    networks:
      - apps
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
networks:
  apps:
    external: true
