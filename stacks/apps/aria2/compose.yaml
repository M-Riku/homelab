version: "3.8"
services:
  aria2:
    image: p3terx/aria2-pro
    container_name: aria2
    environment:
      - PUID=1026
      - PGID=100
      - UMASK=022
      - RPC_SECRET=19940208
      - RPC_PORT=6800
      - LISTEN_PORT=6888
      - DISK_CACHE=64M
      - TZ=Asia/Shanghai
    volumes:
      - /mnt/nas/Config/aria2:/config
      - /mnt/nas/Downloads:/downloads
    ports:
      - 6800:6800
      - 6888:6888
      - 6888:6888/udp
    networks:
      - apps
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
  ariang:
    image: p3terx/ariang
    container_name: ariang
    command: --port 6880 --ipv6
    environment:
      - TZ=Asia/Shanghai
    ports:
      - 6880:6880
    networks:
      - apps
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
networks:
  apps:
    external: true
