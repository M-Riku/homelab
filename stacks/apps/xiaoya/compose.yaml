version: "3.8"
services:
  xiaoya:
    image: xiaoyaliu/alist 
    container_name: xiaoya 
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=Asia/Shanghai
    volumes:
      - /mnt/nas/Config/xiaoya:/data
    ports:
      - 5678:80
    networks:
      - apps
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
networks:
  apps:
    external: true
