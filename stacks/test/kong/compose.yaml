version: "3.8"
services:
  kong-db:
    image: postgres:9.6
    container_name: kong-db
    environment:
    - POSTGRES_DB=kong
    - POSTGRES_USER=kong
    - POSTGRES_PASSWORD=kongpass
    ports:
      - 5432:5432
    networks:
      - apps
  
  kong-gateway:
    image: kong/kong-gateway:2.6.1.0-alpine
    container_name: kong-gateway
    environment:
      - KONG_DATABASE=postgres
      - KONG_PG_HOST=kong-db
      - KONG_PG_USER=kong
      - KONG_PG_PASSWORD=kongpass
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
      - KONG_ADMIN_GUI_URL=http://localhost:8002
    ports:
      - 8000:8000
      - 8443:8443
      - 8001:8001
      - 8444:8444
      - 8002:8002
      - 8445:8445
      - 8003:8003
      - 8004:8004
    networks:
      - apps
    depends_on:
      - kong-db

  konga:
    image: pantsel/konga
    container_name: konga
    environment:
      - TOKEN_SECRET=test
      - DB_ADAPTER=postgres
      - DB_HOST=kong-db
      - DB_PORT=5432
      - DB_USER=kong
      - DB_PASSWORD=kongpass
      - DB_DATABASE=konga_database
      - NODE_ENV=development
    ports:
      - 1337:1337
    networks:
      - apps
    depends_on:
      - kong-gateway
networks:
  apps:
    external: true